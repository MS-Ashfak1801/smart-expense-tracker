<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Income</title>

    <link rel="stylesheet"
          href="../css/income.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="background">

    <span></span>
    <span></span>
    <span></span>
    <span></span>

</div>

<!-- Sidebar -->

<div class="sidebar">

    <h2>💰 Expense Tracker</h2>

    <ul>

        <li>
            <a href="dashboard.html">
                <i class="fas fa-house"></i>
                Dashboard
            </a>
        </li>

        <li>
            <a href="income.html" class="active">
                <i class="fas fa-wallet"></i>
                Income
            </a>
        </li>

        <li>
            <a href="expense.html">
                <i class="fas fa-money-bill-wave"></i>
                Expense
            </a>
        </li>

        <li>
            <a href="report.html">
                <i class="fas fa-chart-column"></i>
                Reports
            </a>
        </li>

        <li>
            <a href="login.html">
                <i class="fas fa-right-from-bracket"></i>
                Logout
            </a>
        </li>

    </ul>

</div>

<!-- Main -->

<div class="main-content">

    <div class="top-bar">

        <h1>✏ Update Income</h1>

        <p>Update your income details.</p>

    </div>

    <div class="form-card">

        <form id="updateIncomeForm">

            <div class="input-group">

                <label>Income ID</label>

                <input
                        type="number"
                        id="incomeId"
                        placeholder="Enter Income ID"
                        required>

            </div>

            <div class="input-group">

                <label>Income Source</label>

                <input
                        type="text"
                        id="source"
                        placeholder="Enter Source"
                        required>

            </div>

            <div class="input-group">

                <label>Amount</label>

                <input
                        type="number"
                        id="amount"
                        placeholder="Enter Amount"
                        required>

            </div>

            <div class="input-group">

                <label>Date</label>

                <input
                        type="date"
                        id="date"
                        required>

            </div>

            <button
                    type="submit"
                    class="btn">

                Update Income

            </button>

        </form>

        <br>

        <a href="income.html"
           class="btn">

            ← Back

        </a>

    </div>

</div>

<script src="../js/update-income.js"></script>

</body>

</html>
