<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Expense Tracker</title>

    <link rel="stylesheet" href="../css/register.css">
</head>
<body>

<div class="background">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="money money1">💰</div>
<div class="money money2">💸</div>
<div class="money money3">💵</div>
<div class="money money4">💰</div>
<div class="money money5">💸</div>

<div class="container">

    <div class="left-section">
        <h1>💰 Smart Expense Tracker</h1>
        <p>
            Create your account and start managing
            your income, expenses, budgets and reports.
        </p>
    </div>

    <div class="register-card">

        <h2>Create Account</h2>

        <form id="registerForm">

            <input
                    type="text"
                    id="username"
                    placeholder="Enter Username"
                    required>

            <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required>

            <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required>

            <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script src="../js/register.js"></script>

</body>
</html>
